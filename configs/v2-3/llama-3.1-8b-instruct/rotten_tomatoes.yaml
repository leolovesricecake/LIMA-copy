# Paper v2.3 main method: Rotten Tomatoes validation with Llama-3.1-8B-Instruct.
results_dir: results/mobius
# run_suffix: paper-v2.3-main
output_level: standard
method: sparse_mobius
budget: 512
seed: 42
max_degree: 2
k: 8
value_function: predicted_probability
target_mode: predicted
chunker: word
eval_granularity: word
eval_q_values: [5, 10, 20, 50]
min_features: 1
max_features: null
batch_size: 16
basis: deletion_mobius
hierarchy: none
projector: signed_equal_share
sampler:
  name: uniform_size
  include_empty_full: true
estimator:
  name: lasso_support
  refit: ridge_cv
  selection_alpha_scale: 1.0
  alphas: [0.0001, 0.001, 0.01, 0.1]
  l1_ratios: [1.0]
  cv_folds: 3
  max_design_mb: 2048
dataset:
  name: rotten_tomatoes
  split: validation
  dataset_cache_dir: /mnt/huawei/nsq/temp/hf
model:
  type: hf_causal_lm
  model_path: /mnt/huawei/nsq/models/meta-llama/Llama-3.1-8B-Instruct
  device: cuda:0
  dtype: bfloat16
  max_length: 2048
