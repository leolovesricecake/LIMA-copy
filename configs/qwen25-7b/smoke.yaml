# CPU-only deterministic smoke run with two inline samples.
results_dir: results/mobius-smoke
run_suffix: smoke
output_level: debug
method: sparse_mobius
budget: 16
seed: 7
max_degree: 2
k: 3
value_function: target_probability
target_mode: predicted
chunker: word
eval_granularity: word
eval_q_values: [20, 50]
min_features: 1
max_features: null
batch_size: 8
targeted_top_k: 2
basis: deletion_mobius
hierarchy: none
projector: signed_equal_share
sampler:
  name: deletion_mixture
  include_empty_full: true
estimator:
  name: lasso_cv_ridge_refit
  alphas: [0.0001, 0.001, 0.01]
  l1_ratios: [1.0]
  cv_folds: 2
dataset:
  name: inline_sentiment
  split: validation
  verbalizers: [negative, positive]
  samples:
    - sample_id: smoke-positive
      text: "A smart and moving film with excellent performances."
      label: 1
    - sample_id: smoke-negative
      text: "A dull mess that is not good."
      label: 0
model:
  type: mock_sentiment
  max_length: 2048
