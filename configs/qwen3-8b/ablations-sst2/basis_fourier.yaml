# Single-axis ablation: parity/Fourier columns replace deletion-Mobius columns.
results_dir: results/mobius-ablations
run_suffix: basis_fourier
output_level: standard
method: sparse_mobius
budget: 512
seed: 42
max_degree: 2
k: 8
value_function: target_probability
target_mode: predicted
chunker: word
eval_granularity: word
eval_q_values: [1, 5, 10, 20, 50]
min_features: 1
max_features: null
batch_size: 16
targeted_top_k: 0
basis: fourier
hierarchy: none
projector: signed_equal_share
sampler:
  name: deletion_mixture
  global_fraction: 0.5
  near_full_fraction: 0.3
  fixed_cardinality_fraction: 0.2
  include_empty_full: true
estimator:
  name: lasso_cv_ridge_refit
  alphas: [0.0001, 0.001, 0.01, 0.1]
  l1_ratios: [1.0]
  cv_folds: 3
dataset:
  name: sst2
  split: validation
  dataset_cache_dir: /mnt/huawei/nsq/temp/hf
model:
  type: hf_causal_lm
  model_path: /mnt/huawei/nsq/models/Qwen/Qwen3-8B
  device: cuda:0
  dtype: bfloat16
  max_length: 2048

