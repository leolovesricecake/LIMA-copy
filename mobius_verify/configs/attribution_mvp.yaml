results_dir: mobius_verify/results/attribution_mvp
seeds: [0, 1, 2]
budget_alphas: [1, 2, 4, 8]
max_records: 50
min_features: 4
max_features: 128
mask_operator: delete
batch_size: 16
max_degree: 2
value_functions: [predicted_class_margin, raw_target_score]
run_controlled: true
run_native: true
controlled_methods:
  - additive_lasso
  - presence_mobius
  - deletion_mobius
  - fourier
  - sklearn_gbt
  - proxyspex_fixed_observations
native_methods:
  - deletion_mobius
  - proxyspex
evaluation_masks_per_distribution: 128
near_full_deletions: [1, 2, 3, 5, 10]
fixed_keep_fractions: [0.25, 0.5, 0.75]
attribution_fractions: [0, 0.1, 0.2, 0.3, 0.5, 1]
targeted_top_k: 5
decision_min_samples: 10
proxyspex_noninferiority_margin: -0.02
hyperedge_stability_floor: 0.1
fail_fast: false

dataset:
  name: sst2
  split: validation
  max_samples: 50
  dataset_cache_dir: /mnt/huawei/nsq/temp/hf
  verbalizers: [negative, positive]

model:
  type: hf_causal_lm
  model_path: /mnt/huawei/nsq/models/Qwen/Qwen2.5-7B-Instruct
  device: cuda:0
  dtype: bfloat16
  max_length: 2048

fit:
  alphas: [0.0001, 0.001, 0.01, 0.1]
  l1_ratios: [1.0]
  cv_folds: 3
  max_design_mb: 2048

gbt_param_grid:
  max_depth: [2, 3]
  n_estimators: [50, 100]
  learning_rate: [0.05, 0.1]
  subsample: [1.0]

proxyspex:
  proxy_model: lightgbm
  hpo: true
  index: FBII
  max_order: 2
