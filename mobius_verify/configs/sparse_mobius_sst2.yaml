results_dir: results/mobius/sparse_mobius

# One config is one method run. Launch other budgets/seeds as separate commands.
budget: 512
seed: 42
max_degree: 2
k: 8
# value_function: predicted_class_margin
value_function: target_probability
target_mode: predicted

chunker: word
adaptive_profile: balanced
adaptive_overrides_json: null
eval_granularity: token
eval_q_values: [1, 5, 10, 20, 50]

min_features: 1
max_features: null
batch_size: 16
targeted_top_k: 5
fail_fast: false
deterministic: false

sampler:
  global_fraction: 0.5
  near_full_fraction: 0.3
  fixed_cardinality_fraction: 0.2
  near_full_deletions: [1, 2, 3, 5]
  fixed_keep_fractions: [0.25, 0.5, 0.75]
  include_empty_full: true

dataset:
  name: sst2
  split: validation
  # max_samples: 50
  dataset_cache_dir: /mnt/huawei/nsq/temp/hf

model:
  type: hf_causal_lm
  model_path: /mnt/huawei/nsq/models/Qwen/Qwen2.5-7B-Instruct
  device: cuda:0
  dtype: bfloat16
  max_length: 2048

fit:
  alphas: [0.0001, 0.001, 0.01, 0.1]
  l1_ratios: [1.0]
  cv_folds: 3
  max_design_mb: 2048
