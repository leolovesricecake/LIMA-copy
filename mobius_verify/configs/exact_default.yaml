results_dir: mobius_verify/results/exact_default
seed: 0
max_records: 100
mask_operator: delete
batch_size: 16

dataset:
  name: sst2
  split: validation
  dataset_cache_dir: /mnt/huawei/nsq/temp/hf
  verbalizers: [negative, positive]

model:
  type: hf_causal_lm
  model_path: /mnt/huawei/nsq/models/Qwen/Qwen2.5-7B-Instruct
  device: cuda:0
  dtype: bfloat16
  max_length: 2048

value_function:
  type: predicted_class_margin
  verbalizer_length_normalization: mean
  target_class_source: full_input_prediction

featureization:
  type: lexical_words
  merge_subwords: true
  preserve_all_words: true
  punctuation_policy: attach_to_neighbor
  fixed_n: null

exact_global:
  enabled: true
  min_n: 6
  max_n: 10
  length_bins:
    - [6, 8]
    - [9, 10]

exact_probe:
  enabled: true
  probe_sizes: [6, 8]
  probes_per_sample: 1
  strategies:
    - contiguous_random
    - dispersed_random
    - stratified_position
  conditioning_mode: rest_present

